[package]
name = "tec-crawl"
description = "Crawl The Events Calendar REST APIs and emit JSON lines"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["wordpress", "events", "calendar", "crawler", "cli"]
categories = ["command-line-utilities", "web-programming::http-client"]

[dependencies]
tec-client = { workspace = true, features = ["system-roots", "bundled-roots"] }
clap.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
jiff.workspace = true
url.workspace = true
