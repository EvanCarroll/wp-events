[workspace]
resolver = "3"
members = ["crates/tec-client", "crates/tec-crawl"]

[workspace.package]
edition = "2024"
version = "1.0.0"
authors = ["Evan Carroll <me@evancarroll.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/EvanCarroll/wp-events"
homepage = "https://github.com/EvanCarroll/wp-events"

[workspace.dependencies]
tec-client = { path = "crates/tec-client", version = "1.0.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
webpki-roots = "1.0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = { version = "0.2.40", features = ["serde"] }
url = { version = "2.5.8", features = ["serde"] }
futures = "0.3.34"
tracing = "0.1.44"
wiremock = "0.6.5"
html-escape = "0.3.0"
